name: Create library release archives, create a GH release and publish PyPI wheel and sdist on tag in main branch

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions: {}
jobs:

  build_wheel_for_pypi:
    permissions:
      contents: read # to fetch code (actions/checkout)

    name: Build PyPI wheels
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: true
      matrix:
       pyver: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python on ${{ matrix.pyver }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pyver }} 

      - name: Install pypa/build and twine
        run: python -m pip install --upgrade --user pkginfo setuptools build twine packaging

      - name: Build a binary wheel
        run: python -m build --wheel --outdir dist/

      - name: Validate wheel and sdis for Pypi
        run: python -m twine check dist/*

      - name: Collect built wheels for ${{ matrix.pyver }} 
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.pyver }}
          path: dist/*.whl

  build-pypi-distribs:
    name: Build and publish library to PyPI
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install pypa/build and twine
        run: python -m pip install --user build twine

      - name: Build a source tarball
        run: python -m build --sdist --outdir dist/

      - name: Validate wheel and sdis for Pypi
        run: python -m twine check dist/*

      - name: Upload built archives
        uses: actions/upload-artifact@v4
        with:
          name: pypi_archives
          path: dist/*


  create-gh-release:
    name: Create GH release
    needs:
      - build-pypi-distribs
    runs-on: ubuntu-24.04

    steps:
      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          name: pypi_archives
          path: dist

      - name: Create GH release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*


  create-pypi-release:
    name: Create PyPI release
    needs:
      - create-gh-release
    runs-on: ubuntu-24.04

    steps:
      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          name: pypi_archives
          path: dist

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
